<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">MyPortfolio</div>
      <nav class="nav-links">
        <a href="">About</a>
        <a href="">Skills</a>
        <a href="">Projects</a>
      </nav>
    </header>

    <main class="containers">
      <section class="card-grid">
        <article class="card">
          <span class="badge">HTML5</span>
          <h3>시멘틱 웹</h3>
          <p>
            의미 있는 태그를 활용하여 웹 표준과 접근성을 준수하는 구조를
            설계합니다.
          </p>
        </article>

        <article class="card">
          <span class="badge">CSS3</span>
          <h3>Flexbox 레이아웃</h3>
          <p>복잡한 레이아웃과 수직/수평 정렬을 유연하게 구현합니다.</p>
        </article>

        <article class="card">
          <span class="badge">Git / GitHub</span>
          <h3>버전관리</h3>
          <p>학습 과정과 커밋 히스토리를 체계적으로 기록하고 관리합니다.</p>
        </article>
      </section>
    </main>
  </body>
</html>
